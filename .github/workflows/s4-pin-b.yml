# PixelWatch M0.5 spike S4: foreign caller pinned by full SHA to lib v0.0.2 (bundle v2).
name: S4 pin B (v2)

on:
  workflow_dispatch:

permissions: {}

jobs:
  report:
    permissions:
      actions: read
      contents: write
      pull-requests: write
      pages: write
      id-token: write
    uses: MattShelton04/pixelwatch-spike-lib/.github/workflows/report.yml@7f0ec44808846b50c31387574fac840c21ed85f2 # v0.0.2

  selfref:
    permissions: {}
    uses: MattShelton04/pixelwatch-spike-lib/.github/workflows/selfref.yml@7f0ec44808846b50c31387574fac840c21ed85f2 # v0.0.2

  assert:
    needs: report
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Assert the pinned bundle ran (expect v2 from 7f0ec44)
        env:
          RESULT: ${{ needs.report.result }}
          INGEST_BUNDLE: ${{ needs.report.outputs.ingest-bundle }}
          INGEST_NONCE: ${{ needs.report.outputs.ingest-nonce }}
          INGEST_REPO: ${{ needs.report.outputs.ingest-workflow-repository }}
          INGEST_SHA: ${{ needs.report.outputs.ingest-workflow-sha }}
          PROJECT_BUNDLE: ${{ needs.report.outputs.project-bundle }}
          PROJECT_NONCE: ${{ needs.report.outputs.project-nonce }}
          PROJECT_REPO: ${{ needs.report.outputs.project-workflow-repository }}
          PROJECT_SHA: ${{ needs.report.outputs.project-workflow-sha }}
        run: |
          set -euo pipefail
          fail=0
          check() {
            if [[ "$2" == "$3" ]]; then echo "ok   $1 = $2"; else echo "::error::$1 = '$2', expected '$3'"; fail=1; fi
          }
          check result "$RESULT" success
          check ingest.bundle "$INGEST_BUNDLE" v2
          check ingest.nonce "$INGEST_NONCE" 6667b07e0531783d
          check ingest.workflow_repository "$INGEST_REPO" MattShelton04/pixelwatch-spike-lib
          check ingest.workflow_sha "$INGEST_SHA" 7f0ec44808846b50c31387574fac840c21ed85f2
          check project.bundle "$PROJECT_BUNDLE" v2
          check project.nonce "$PROJECT_NONCE" 6667b07e0531783d
          check project.workflow_repository "$PROJECT_REPO" MattShelton04/pixelwatch-spike-lib
          check project.workflow_sha "$PROJECT_SHA" 7f0ec44808846b50c31387574fac840c21ed85f2
          exit "$fail"

  assert-selfref:
    needs: selfref
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Assert the self-repository variant ran bundle v2
        env:
          RESULT: ${{ needs.selfref.result }}
          BUNDLE: ${{ needs.selfref.outputs.bundle }}
          NONCE: ${{ needs.selfref.outputs.nonce }}
        run: |
          set -euo pipefail
          fail=0
          check() {
            if [[ "$2" == "$3" ]]; then echo "ok   $1 = $2"; else echo "::error::$1 = '$2', expected '$3'"; fail=1; fi
          }
          check result "$RESULT" success
          check bundle "$BUNDLE" v2
          check nonce "$NONCE" 6667b07e0531783d
          exit "$fail"
